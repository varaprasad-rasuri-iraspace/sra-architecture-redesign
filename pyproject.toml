[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sra-architecture-redesign"
version = "1.0.0"
description = "Architecture redesign and production guardrails for the Support Resolution Agent (SRA)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["sra*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
